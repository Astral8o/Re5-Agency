    // document mints the blobs for its OWN frames, obtaining page text

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

an style=\"width:48px;height:48px;border-radius:50%;background:#007750;color:#F3F1EC;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700\">✓<\u002Fspan>\n            <h3 style=\"margin:0;font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:32px;letter-spacing:-0.04em;font-weight:500\">Thanks, we'll be in touch.<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;font-weight:300;color:#3A4A41\">The RE5 team will reach out within one business day.<\u002Fp>\n            <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"align-self:flex-start;background:none;border:1px solid #0D1410;color:#0D1410;border-radius:999px;padding:12px 20px;font-size:14px;cursor:pointer;min-height:44px\">Send another message<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <footer style=\"position:relative;border-top:1px solid #22302A\">\n      <div style=\"max-width:1320px;margin:0 auto;padding:clamp(48px,6vw,80px) clamp(20px,4vw,48px) 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:clamp(32px,4vw,56px)\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;grid-column:span 1;min-width:0\">\n          <a href=\"#top\" style=\"display:flex;align-items:center;gap:10px;color:#F3F1EC\">\n            <span style=\"display:block;width:26px;height:26px;color:#B99ABE;flex:none\"><svg sc-camel-view-box=\"0 0 100 100\" width=\"100%\" height=\"100%\" fill=\"currentColor\"><circle cx=\"50\" cy=\"20\" r=\"15\"><\u002Fcircle><circle cx=\"78.5\" cy=\"40.7\" r=\"15\"><\u002Fcircle><circle cx=\"67.6\" cy=\"74.3\" r=\"15\"><\u002Fcircle><circle cx=\"32.4\" cy=\"74.3\" r=\"15\"><\u002Fcircle><circle cx=\"21.5\" cy=\"40.7\" r=\"15\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n            <span style=\"font-family:'Instrument Sans',Helvetica,Arial,sans-serif;font-size:22px;font-weight:500;letter-spacing:-0.045em;line-height:1;white-space:nowrap\">RE<em style=\"font-style:italic;font-weight:600;letter-spacing:-0.02em\">5<\u002Fem> Agency<\u002Fspan>\n          <\u002Fa>\n          <p style=\"margin:0;font-size:14px;line-height:1.6;font-weight:300;color:#A9B5AE;max-width:260px\">Business Consulting<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#A9B5AE\">Services<\u002Fspan>\n          <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <a href=\"#services\" style=\"color:#F3F1EC;font-size:14px;line-height:1.4\" style-hover=\"color:#B99ABE\">{{ s.title }}<\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#A9B5AE\">Company<\u002Fspan>\n          <a href=\"/blog\" style=\"color:#F3F1EC;font-size:14px;line-height:1.4\" style-hover=\"color:#B99ABE\">Blog<\u002Fa>\n          <a href=\"#contact\" style=\"color:#F3F1EC;font-size:14px;line-height:1.4\" style-hover=\"color:#B99ABE\">Contact<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#A9B5AE\">Get in Touch<\u002Fspan>\n          <span style=\"color:#F3F1EC;font-size:14px;line-height:1.4\">Trinidad &amp; Tobago<\u002Fspan>\n          <a href=\"#contact\" style=\"align-self:flex-start;margin-top:6px;background:#B99ABE;color:#0D1410;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600\" style-hover=\"background:#F3F1EC;color:#0D1410\">Let's Talk Business →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width:1320px;margin:0 auto;padding:clamp(40px,5vw,64px) clamp(20px,4vw,48px) clamp(96px,10vw,32px)\">\n        <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:center;border-top:1px solid #22302A;padding-top:24px\">\n          <span style=\"display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center\"><span style=\"font-size:13px;color:#A9B5AE\">© 2026 RE5 Agency. All rights reserved.<\u002Fspan><a href=\"/privacy\" style=\"font-size:13px;color:#A9B5AE;text-decoration:underline\" style-hover=\"color:#F3F1EC\">Privacy Policy<\u002Fa><\u002Fspan>\n          <a href=\"#top\" style=\"font-size:13px;font-weight:500;color:#F3F1EC\" style-hover=\"color:#B99ABE\">Back to top ↑<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n  <\u002Fsection>\n<\u002Fmain>\n\n<sc-if value=\"{{ showSticky }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:16px;right:16px;bottom:16px;z-index:30;display:flex;justify-content:center;pointer-events:none\">\n    <a href=\"#contact\" style=\"pointer-events:auto;background:#0D1410;color:#F3F1EC;padding:16px 28px;border-radius:999px;font-size:16px;font-weight:600;box-shadow:0 12px 30px rgba(13,20,16,0.35);width:100%;max-width:420px;text-align:center;min-height:52px\" style-hover=\"background:#007750;color:#F3F1EC\">Let's Talk Business →<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;frameworkAutoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;RE5 Framework&quot;},&quot;frameworkInterval&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:2,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;RE5 Framework&quot;},&quot;stickyCta&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mobile&quot;,&quot;always&quot;,&quot;off&quot;],&quot;default&quot;:&quot;mobile&quot;,&quot;tsType&quot;:&quot;'mobile'|'always'|'off'&quot;}}\">\nclass Component extends DCLogic {\n  state = { w: 1280, step: 0, menu: false, scrolled: false, nearContact: false, sent: false, picked: [], sending: false, sendError: false };\n  componentDidMount() {\n    this.mountedAt = Date.now();\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    this.onScroll = () => {\n      const c = document.getElementById('contact');\n      const near = c ? c.getBoundingClientRect().top < window.innerHeight * 0.8 : false;\n      this.setState({ scrolled: window.scrollY > 500, nearContact: near });\n    };\n    this.onResize(); this.onScroll();\n    window.addEventListener('resize', this.onResize);\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  }\n  startCycle() {\n    clearInterval(this.cycle);\n    if (this.reduce || (this.props.frameworkAutoplay ?? true) === false) return;\n    this.cycle = setInterval(() => this.setState(s => ({ step: (s.step + 1) % 5 })), (this.props.frameworkInterval ?? 4) * 1000);\n  }\n  componentWillUnmount() {\n    clearInterval(this.cycle);\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('scroll', this.onScroll);\n  }\n  renderVals() {\n    const e = React.createElement;\n    const pts = [[50, 20], [78.5, 40.7], [67.6, 74.3], [32.4, 74.3], [21.5, 40.7]];\n    const mark = (lit) => e('svg', { viewBox: '0 0 100 100', width: '100%', height: '100%', fill: 'currentColor', style: { display: 'block' } },\n      pts.map(([cx, cy], i) => e('circle', { key: i, cx, cy, r: 15, opacity: lit == null || i <= lit ? 1 : 0.22 })));\n    const narrow = this.state.w < 1080;\n    const stickyMode = this.props.stickyCta ?? 'mobile';\n    const services = [\n      ['Business Consulting', 'Strategy, planning, and operational improvement.'],\n      ['Marketing & Customer Growth', 'Brand development, campaigns, and customer engagement.'],\n      ['Business & Administrative Support', 'Administrative services, customer inquiries, and operational assistance.'],\n      ['Websites & Online Sales', 'Websites, eCommerce, and digital experiences.'],\n      ['Business Systems & Automation', 'CRM, business software, AI, and workflow automation.'],\n    ].map(([title, desc], i) => ({ title, desc, num: String(i + 1).padStart(2, '0') }));\n    const steps = [\n      ['Review', 'Understand your business, assess its performance, and identify opportunities for improvement.'],\n      ['Reimagine', 'Develop practical solutions and a clear plan to achieve your business goals.'],\n      ['Rebuild', 'Implement the tools, systems, and processes needed to put your plan into action.'],\n      ['Revitalize', 'Improve efficiency, strengthen customer experiences, and increase business performance.'],\n      ['Rise', 'Build on your progress,'],\n    ].map(([title, desc], i) => {\n      const act = i === this.state.step, done = i < this.state.step;\n      const ang = (-90 + i * 72) * Math.PI / 180;\n      return { title, desc, n: String(i + 1).padStart(2, '0'), active: act,\n        x: (50 + 42 * Math.cos(ang)) + '%', y: (50 + 42 * Math.sin(ang)) + '%',\n        scale: act ? 1.12 : 1,\n        bg: act ? '#B99ABE' : done ? '#22302A' : '#0D1410', nodeFg: act ? '#0D1410' : '#F3F1EC',\n        border: act ? '#B99ABE' : done ? '#A7C68C' : '#3A4A41',\n        glow: act ? '0 0 0 10px rgba(185,154,190,0.15), 0 0 40px rgba(185,154,190,0.45)' : 'none',\n        fg: act ? '#F3F1EC' : '#A9B5AE', numColor: act ? '#B99ABE' : '#A7C68C',\n        select: () => { this.setState({ step: i }); this.startCycle(); } };\n    });\n    const st = this.state.step, C = 2 * Math.PI * 42;\n    const spin = this.reduce ? 'none' : 're5spin 60s linear infinite';\n    const frameworkRing = e('svg', { viewBox: '0 0 100 100', width: '100%', height: '100%', style: { position: 'absolute', inset: 0, overflow: 'visible' } },\n      e('circle', { cx: 50, cy: 50, r: 42, fill: 'none', stroke: '#22302A', strokeWidth: 0.5 }),\n      e('circle', { cx: 50, cy: 50, r: 42, fill: 'none', stroke: '#B99ABE', strokeWidth: 0.8, strokeLinecap: 'round', strokeDasharray: C, strokeDashoffset: C * (1 - st / 5), transform: 'rotate(-90 50 50)', style: { transition: 'stroke-dashoffset 1s cubic-bezier(.6,0,.2,1)' } }),\n      e('g', { style: { transformOrigin: '50px 50px', animation: spin } },\n        e('circle', { cx: 50, cy: 50, r: 32, fill: 'none', stroke: 'rgba(243,241,236,0.18)', strokeWidth: 0.35, strokeDasharray: '1 2.2' })),\n      e('circle', { cx: 50, cy: 50, r: 22, fill: 'rgba(0,119,80,0.18)', stroke: 'rgba(167,198,140,0.25)', strokeWidth: 0.3 }));\n    const covers = [\n      'radial-gradient(60% 70% at 25% 30%, #007750 0%, rgba(0,119,80,0) 72%), radial-gradient(55% 60% at 85% 85%, #A7C68C 0%, rgba(167,198,140,0) 70%), #0D1410',\n      'radial-gradient(60% 70% at 75% 25%, #B99ABE 0%, rgba(185,154,190,0) 72%), radial-gradient(55% 60% at 15% 85%, #007750 0%, rgba(0,119,80,0) 70%), #0D1410',\n      'radial-gradient(65% 70% at 30% 75%, #B99ABE 0%, rgba(185,154,190,0) 70%), radial-gradient(55% 55% at 80% 20%, #A7C68C 0%, rgba(167,198,140,0) 72%), #0D1410'];\n    const posts = [\n      ['Visibility', '5 min read', 'Why being found online matters more than ever for SMEs'],\n      ['Payments', '6 min read', 'Accepting online payments: what Caribbean small businesses need to know'],\n      ['AI Search', '4 min read', 'How AI is changing the way customers discover your business'],\n    ].map(([tag, time, title], i) => ({ tag, time, title, cover: covers[i], mark: mark() }));\n    const picked = this.state.picked;\n    const interestChips = services.map(s => {\n      const on = picked.includes(s.title);\n      return {\n        title: s.title,\n        bg: on ? '#0D1410' : 'transparent', fg: on ? '#F3F1EC' : '#0D1410', border: on ? '#0D1410' : '#C9C5BB',\n        toggle: () => this.setState(st => ({ picked: st.picked.includes(s.title) ? st.picked.filter(x => x !== s.title) : [...st.picked, s.title] })),\n      };\n    });\n    const stickyAllowed = stickyMode === 'always' || (stickyMode === 'mobile' && narrow);\n    return {\n      wide: !narrow, narrow,\n      menuVisible: narrow && this.state.menu,\n      menuLabel: this.state.menu ? 'Close' : 'Menu',\n      toggleMenu: () => this.setState(s => ({ menu: !s.menu })),\n      closeMenu: () => this.setState({ menu: false }),\n      services, steps, posts, interestChips, frameworkRing,\n      activeTitle: steps[st].title, activeN: steps[st].n, activeMark: mark(st),\n      showSticky: stickyAllowed && this.state.scrolled && !this.state.nearContact && !this.state.menu,\n      sent: this.state.sent, notSent: !this.state.sent,\n      submit: async ev => {\n        ev.preventDefault();\n        if (this.state.sending) return;\n        const f = new FormData(ev.target);\n        this.setState({ sending: true, sendError: false });\n        try {\n          const res = await fetch('/api/contact', {\n            method: 'POST',\n            headers: { 'Content-Type': 'application/json' },\n            body: JSON.stringify({\n              name: f.get('name'), company: f.get('company'), email: f.get('email'), phone: f.get('phone'),\n              interests: this.state.picked, message: f.get('message'),\n              website: f.get('website'), elapsed: Date.now() - (this.mountedAt || 0),\n            }),\n          });\n          if (!res.ok) throw new Error('failed');\n          this.setState({ sent: true, sending: false });\n        } catch (err) {\n          this.setState({ sending: false, sendError: true });\n        }\n      },\n      submitLabel: this.state.sending ? 'Sending…' : 'Start a Conversation →',\n      sendError: this.state.sendError,\n      reset: () => this.setState({ sent: false, picked: [], sendError: false }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:960px;height:600px;overflow:hidden;font-family:"Instrument Sans",Inter,sans-serif;background:#fbf6f3;color:#2a1a1f;position:relative}
.demo{background:#1d1215;color:#fff;font-size:11px;padding:5px 14px;display:flex;justify-content:space-between}
.demo b{font-weight:700}.demo span:last-child{color:#f2b8b0}
nav{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #eedfdb}
.logo{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;letter-spacing:.04em}
.logo small{display:block;font-family:"Instrument Sans";font-size:8px;letter-spacing:.32em;color:#b0605a;margin-top:-3px}
nav ul{display:flex;gap:22px;list-style:none;font-size:12.5px}
.bag{border:1.5px solid #2a1a1f;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600}
.bag i{font-style:normal;background:#b0605a;color:#fff;border-radius:99px;padding:0 6px;margin-left:6px}
.banner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 6px}
.kick{font-size:9.5px;letter-spacing:.22em;color:#b0605a;font-weight:600}
h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:34px;line-height:1}
h2 em{font-style:italic;color:#b0605a}
.filters{display:flex;gap:16px;align-items:center;font-size:11px}
.filters .grp{display:flex;gap:5px;align-items:center}
.chip{border:1px solid #d8c4bf;border-radius:99px;padding:3px 9px;font-size:10.5px;background:#fff}
.chip.on{background:#2a1a1f;color:#fff;border-color:#2a1a1f}
.sw{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px #d8c4bf;border:2px solid #fff;display:inline-block}
.sw.sel{box-shadow:0 0 0 2px #2a1a1f}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;padding:10px 24px}
.ph{background:#f4ece8;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ph img{mix-blend-mode:multiply;width:100%;height:100%;object-fit:contain}
.card .ph{height:330px;border-radius:10px;padding:10px 6px}
.tag{position:absolute;top:8px;left:8px;background:#fff;font-size:8.5px;letter-spacing:.08em;padding:3px 7px;border-radius:99px;font-weight:600;z-index:1}
.tag.d{background:#2a1a1f;color:#fff}
.card h4{font-size:11.5px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{display:flex;justify-content:space-between;font-size:11px;margin-top:2px;color:#6d585c}
.card .meta b{color:#2a1a1f}
.sizes{display:flex;gap:3px;margin-top:5px}
.sizes span{font-size:8.5px;border:1px solid #d8c4bf;border-radius:4px;padding:1px 4px;background:#fff}
.sizes span.x{color:#c9b5b1;text-decoration:line-through}
.dim{position:absolute;inset:0;z-index:5;background:rgba(29,18,21,.45)}
.modal{z-index:6;position:absolute;top:70px;left:140px;width:680px;height:470px;background:#fff;border-radius:16px;display:grid;grid-template-columns:300px 1fr;grid-template-rows:470px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .ph{padding:24px 18px}
.modal .info{padding:22px 24px;display:flex;flex-direction:column;position:relative}
.modal h3{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:500;line-height:1.05}
.price{font-size:16px;font-weight:700;margin:6px 0 4px}
.desc{font-size:11.5px;color:#6d585c;line-height:1.5;margin-bottom:8px}
.lab{font-size:10px;letter-spacing:.14em;font-weight:600;color:#6d585c;margin:8px 0 6px}
.szs{display:flex;gap:6px}
.szs span{width:38px;text-align:center;border:1.5px solid #d8c4bf;border-radius:8px;padding:6px 0;font-size:12px;font-weight:600}
.szs span.on{border-color:#2a1a1f;background:#2a1a1f;color:#fff}
.szs span.x{color:#cdbab6;text-decoration:line-through}
.stock{font-size:10.5px;color:#2e8b57;margin-top:7px;font-weight:600}
.pair{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:10.5px;color:#6d585c}
.pair .ph{width:38px;height:42px;border-radius:6px;padding:2px}
.btn{border-radius:99px;text-align:center;padding:11px;font-weight:600;font-size:12.5px;margin-top:8px}
.btn.p{background:#2a1a1f;color:#fff;margin-top:auto}
.btn.s{border:1.5px solid #2a1a1f}
.x1{position:absolute;top:14px;right:16px;font-size:16px}
.drawer{z-index:6;position:absolute;top:0;right:0;width:360px;height:600px;background:#fff;padding:18px 20px;display:flex;flex-direction:column;box-shadow:-12px 0 30px rgba(0,0,0,.18)}
.drawer h3{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;margin-bottom:6px}
.li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #f1e5e2}
.li .ph{width:46px;height:52px;border-radius:6px;padding:3px}
.li div{flex:1;font-size:11.5px;font-weight:600}.li small{display:block;font-weight:400;color:#6d585c;font-size:10px}
.li b{font-size:12px}
.opt{border:1.5px solid #d8c4bf;border-radius:10px;padding:7px 10px;font-size:11px;margin-top:6px;display:flex;gap:8px;align-items:flex-start}
.opt.on{border-color:#2a1a1f;background:#fbf3f1}
.opt i{width:12px;height:12px;border-radius:50%;border:1.5px solid #2a1a1f;margin-top:2px;flex:none}
.opt.on i{background:radial-gradient(#2a1a1f 45%,transparent 50%)}
.opt small{display:block;color:#6d585c;font-size:9.5px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-top:10px}
.wa{background:#1fa855;color:#fff}
</style></head><body>
<div class="demo"><span><b>Concept</b> · Fictional boutique · Illustration by RE5 Agency</span><span>Fashion boutique website</span></div>
<nav><div class="logo">Rosé &amp; Rue<small>BOUTIQUE · PORT OF SPAIN</small></div>
<ul><li>New in</li><li>Dresses</li><li>Tops</li><li>Skirts &amp; shorts</li><li>Visit us</li></ul><div class="bag">Bag <i id="bagn">0</i></div></nav>
<div class="banner"><div><div class="kick">NEW ARRIVALS · THIS WEEK</div><h2>The Weekend <em>Edit</em></h2></div>
<div class="filters"><div class="grp">Size <span class="chip">XS</span><span class="chip on">S</span><span class="chip">M</span><span class="chip">L</span><span class="chip">XL</span></div>
<div class="grp">Colour <span class="sw" style="background:#9cc0e0"></span><span class="sw sel" style="background:#8fa874"></span><span class="sw" style="background:#f3ece0"></span><span class="sw" style="background:#d27a80"></span></div></div></div>
<div class="grid" id="grid"></div>
<script>
const I = n => `img/products/${n}.jpg`;
const P=[["sage-wrap-dress","Sage Floral Wrap Dress","TT$420",["XS","S","M","L"],"NEW"],
["blue-sundress","Smocked Tiered Sundress","TT$385",["S","M","L","XL"],"NEW"],
["eyelet-peplum-top","Eyelet Peplum Top","TT$295",["XS","S","M"],"LAST FEW"],
["sage-button-skirt","Button Midi Skirt","TT$340",["S","M","L","XL"],""],
["rose-ribbed-tank","Rose Ribbed Tank","TT$150",["XS","S","M","L","XL"],""],
["paperbag-bow-shorts","Linen Bow Shorts","TT$260",["S","M","L"],""]];
const s=new URLSearchParams(location.search).get('s')||'grid';
document.getElementById('grid').innerHTML=P.map(p=>`<div class="card"><div class="ph">${p[4]?`<span class="tag ${p[4]=='LAST FEW'?'d':''}">${p[4]}</span>`:''}<img src="${I(p[0])}"></div><h4>${p[1]}</h4><div class="meta"><b>${p[2]}</b><span>${p[3].length} sizes</span></div><div class="sizes">${["XS","S","M","L","XL"].map(z=>`<span class="${p[3].includes(z)?'':'x'}">${z}</span>`).join('')}</div></div>`).join('');
if(s==='modal'){document.body.insertAdjacentHTML('beforeend',`<div class="dim"></div><div class="modal"><div class="ph"><img src="${I('sage-wrap-dress')}"></div><div class="info"><span class="x1">✕</span><div class="kick">NEW ARRIVAL</div><h3>Sage Floral Wrap Dress</h3><div class="price">TT$420</div><p class="desc">Ditsy floral wrap dress with flutter sleeves, a tie waist and a ruffled hem.</p><div class="lab">SIZE</div><div class="szs"><span>XS</span><span class="on">S</span><span>M</span><span>L</span><span class="x">XL</span></div><div class="stock">● In stock at the boutique · 2 left in S</div><div class="pair"><span class="ph"><img src="${I('eyelet-peplum-top')}"></span><span class="ph"><img src="${I('paperbag-bow-shorts')}"></span>Complete the look: Eyelet Peplum Top, Linen Bow Shorts</div><div class="btn p">Add to bag · TT$420</div><div class="btn s">Reserve for in-store pickup</div></div></div>`);}
if(s==='bag'){document.getElementById('bagn').textContent='3';document.body.insertAdjacentHTML('beforeend',`<div class="dim"></div><div class="drawer"><h3>Your bag</h3>
<div class="li"><span class="ph"><img src="${I('sage-wrap-dress')}"></span><div>Sage Floral Wrap Dress<small>Size S</small></div><b>TT$420</b></div>
<div class="li"><span class="ph"><img src="${I('cream-linen-shirt')}"></span><div>Cream Linen Shirt<small>Size M</small></div><b>TT$310</b></div>
<div class="li"><span class="ph"><img src="${I('pleated-bow-shorts')}"></span><div>Pleated Bow Shorts<small>Size M</small></div><b>TT$275</b></div>
<div class="lab" style="margin-top:10px">HOW WOULD YOU LIKE IT?</div>
<div class="opt on"><i></i><div>Reserve and collect at the boutique<small>Held for 48 hours · try on before you pay</small></div></div>
<div class="opt"><i></i><div>Island-wide delivery<small>2 to 3 working days · fee confirmed before dispatch</small></div></div>
<div class="lab" style="margin-top:8px">PAYMENT</div>
<div class="opt on"><i></i><div>Pay in store</div></div>
<div class="opt"><i></i><div>Bank transfer or card online</div></div>
<div class="tot"><span>Total</span><span>TT$1,005</span></div>
<div class="btn p" style="margin-top:auto">Reserve my pieces</div><div class="btn wa">Or send to us on WhatsApp</div></div>`);}
</script></body></html>

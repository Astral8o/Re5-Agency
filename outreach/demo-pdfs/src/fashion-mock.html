<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:960px;height:600px;overflow:hidden;font-family:"Instrument Sans",Inter,sans-serif;background:#fbf6f3;color:#2a1a1f;position:relative}
.demo{background:#1d1215;color:#fff;font-size:11px;padding:5px 14px;display:flex;justify-content:space-between}
.demo b{font-weight:700}.demo span:last-child{color:#f2b8b0}
nav{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #eedfdb}
.logo{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;letter-spacing:.04em}
.logo small{display:block;font-family:"Instrument Sans";font-size:8px;letter-spacing:.32em;color:#b0605a;margin-top:-3px}
nav ul{display:flex;gap:22px;list-style:none;font-size:12.5px}
.bag{border:1.5px solid #2a1a1f;border-radius:99px;padding:6px 14px;font-size:12px;font-weight:600}
.bag i{font-style:normal;background:#b0605a;color:#fff;border-radius:99px;padding:0 6px;margin-left:6px}
.banner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 6px}
.kick{font-size:9.5px;letter-spacing:.22em;color:#b0605a;font-weight:600}
h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:34px;line-height:1}
h2 em{font-style:italic;color:#b0605a}
.filters{display:flex;gap:16px;align-items:center;font-size:11px}
.filters .grp{display:flex;gap:5px;align-items:center}
.chip{border:1px solid #d8c4bf;border-radius:99px;padding:3px 9px;font-size:10.5px;background:#fff}
.chip.on{background:#2a1a1f;color:#fff;border-color:#2a1a1f}
.sw{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1px #d8c4bf;border:2px solid #fff;display:inline-block}
.sw.sel{box-shadow:0 0 0 2px #2a1a1f}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:10px 24px}
.card .img{height:285px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden}
.card .img svg{height:92%}
.tag{position:absolute;top:8px;left:8px;background:#fff;font-size:8.5px;letter-spacing:.08em;padding:3px 7px;border-radius:99px;font-weight:600}
.tag.d{background:#2a1a1f;color:#fff}
.card h4{font-size:12px;font-weight:600;margin-top:7px}
.card .meta{display:flex;justify-content:space-between;font-size:11px;margin-top:2px;color:#6d585c}
.card .meta b{color:#2a1a1f}
.sizes{display:flex;gap:3px;margin-top:5px}
.sizes span{font-size:8.5px;border:1px solid #d8c4bf;border-radius:4px;padding:1px 4px;background:#fff}
.sizes span.x{color:#c9b5b1;text-decoration:line-through}
.dim{position:absolute;inset:0;background:rgba(29,18,21,.45)}
.modal{position:absolute;top:70px;left:140px;width:680px;height:470px;background:#fff;border-radius:16px;display:grid;grid-template-columns:300px 1fr;grid-template-rows:470px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal .pic{background:#e9d3cc;display:flex;align-items:flex-end;justify-content:center;min-height:0;overflow:hidden}
.modal .pic svg{height:440px}
.modal .info{padding:22px 24px;display:flex;flex-direction:column}
.modal h3{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:500;line-height:1.05}
.price{font-size:16px;font-weight:700;margin:6px 0 4px}
.desc{font-size:11.5px;color:#6d585c;line-height:1.5;margin-bottom:12px}
.lab{font-size:10px;letter-spacing:.14em;font-weight:600;color:#6d585c;margin:8px 0 6px}
.szs{display:flex;gap:6px}
.szs span{width:38px;text-align:center;border:1.5px solid #d8c4bf;border-radius:8px;padding:6px 0;font-size:12px;font-weight:600}
.szs span.on{border-color:#2a1a1f;background:#2a1a1f;color:#fff}
.szs span.x{color:#cdbab6;text-decoration:line-through}
.stock{font-size:10.5px;color:#2e8b57;margin-top:7px;font-weight:600}
.btn{border-radius:99px;text-align:center;padding:11px;font-weight:600;font-size:12.5px;margin-top:8px}
.btn.p{background:#2a1a1f;color:#fff;margin-top:auto}
.btn.s{border:1.5px solid #2a1a1f}
.x1{position:absolute;top:12px;right:14px;font-size:16px}
.drawer{position:absolute;top:0;right:0;width:360px;height:600px;background:#fff;padding:18px 20px;display:flex;flex-direction:column;box-shadow:-12px 0 30px rgba(0,0,0,.18)}
.drawer h3{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;margin-bottom:10px}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f1e5e2}
.th{width:44px;height:56px;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.th svg{height:92%}
.li div{flex:1;font-size:11.5px;font-weight:600}.li small{display:block;font-weight:400;color:#6d585c;font-size:10px}
.li b{font-size:12px}
.opt{border:1.5px solid #d8c4bf;border-radius:10px;padding:8px 10px;font-size:11px;margin-top:6px;display:flex;gap:8px;align-items:flex-start}
.opt.on{border-color:#2a1a1f;background:#fbf3f1}
.opt i{width:12px;height:12px;border-radius:50%;border:1.5px solid #2a1a1f;margin-top:2px;flex:none}
.opt.on i{background:radial-gradient(#2a1a1f 45%,transparent 50%)}
.opt small{display:block;color:#6d585c;font-size:9.5px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-top:12px}
.wa{background:#1fa855;color:#fff}
</style></head><body>
<div class="demo"><span><b>Concept</b> · Fictional boutique · Illustration by RE5 Agency</span><span>Fashion boutique website</span></div>
<nav><div class="logo">Rosé &amp; Rue<small>BOUTIQUE · PORT OF SPAIN</small></div>
<ul><li>New in</li><li>Dresses</li><li>Sets</li><li>Accessories</li><li>Visit us</li></ul><div class="bag">Bag <i id="bagn">0</i></div></nav>
<div class="banner"><div><div class="kick">NEW ARRIVALS · THIS WEEK</div><h2>The Weekend <em>Edit</em></h2></div>
<div class="filters"><div class="grp">Size <span class="chip">XS</span><span class="chip on">S</span><span class="chip">M</span><span class="chip">L</span><span class="chip">XL</span></div>
<div class="grp">Colour <span class="sw sel" style="background:#b0605a"></span><span class="sw" style="background:#f3e3d3"></span><span class="sw" style="background:#2a1a1f"></span><span class="sw" style="background:#7d9a78"></span></div></div></div>
<div class="grid" id="grid"></div>
<script>
const D = {
 dress:(c)=>`<svg viewBox="0 0 100 200"><path d="M38 10h24l-2 18 10 20-6 6 22 140H14L36 54l-6-6 10-20z" fill="${c}"/><path d="M40 10c3 8 17 8 20 0" stroke="#0002" fill="none" stroke-width="2"/><path d="M33 56h34" stroke="#0002" stroke-width="2"/></svg>`,
 set:(c)=>`<svg viewBox="0 0 100 200"><path d="M30 12h40l10 30-12 4-2 30H34l-2-30-12-4z" fill="${c}"/><path d="M33 82h34l14 112H64l-14-80-14 80H19z" fill="${c}" opacity=".85"/></svg>`,
 midi:(c)=>`<svg viewBox="0 0 100 200"><path d="M36 10h28l4 36-4 10 26 120H10L36 56l-4-10z" fill="${c}"/><path d="M30 56h40" stroke="#fff6" stroke-width="5"/></svg>`,
 top:(c)=>`<svg viewBox="0 0 100 200"><path d="M26 14h48l14 40-14 4v40H26V58l-14-4z" fill="${c}"/><path d="M30 102h40l18 92H12z" fill="#2a1a1f" opacity=".9"/></svg>`,
 jump:(c)=>`<svg viewBox="0 0 100 200"><path d="M34 10h32l4 40-2 30 12 114H58L50 104l-8 90H20l12-114-2-30z" fill="${c}"/><path d="M30 78h40" stroke="#0003" stroke-width="3"/></svg>`};
const P=[["dress","#b0605a","#f0dcd5","Coral Wrap Dress","TT$420",["XS","S","M","L"],"x3","NEW"],
["set","#f3e3d3","#e4ddd3","Linen Co-ord Set","TT$560",["S","M","L","XL"],"","NEW"],
["midi","#2a1a1f","#ead8d1","Evening Slip Midi","TT$480",["XS","S","M"],"x0","LAST FEW"],
["top","#7d9a78","#e2e6dc","Sage Tie Top","TT$260",["S","M","L"],"",""],
["jump","#c98a5e","#efe0d2","Sunset Jumpsuit","TT$510",["XS","S","M","L"],"x2",""]];
const s=new URLSearchParams(location.search).get('s')||'grid';
document.getElementById('grid').innerHTML=P.map(p=>`<div class="card"><div class="img" style="background:${p[2]}">${p[7]?`<span class="tag ${p[7]=='LAST FEW'?'d':''}">${p[7]}</span>`:''}${D[p[0]](p[1])}</div><h4>${p[3]}</h4><div class="meta"><b>${p[4]}</b><span>${p[5].length} sizes</span></div><div class="sizes">${["XS","S","M","L","XL"].map((z,i)=>`<span class="${p[5].includes(z)?'':'x'}">${z}</span>`).join('')}</div></div>`).join('');
if(s==='modal'){document.body.insertAdjacentHTML('beforeend',`<div class="dim"></div><div class="modal"><div class="pic">${D.dress('#b0605a')}</div><div class="info"><span class="x1">✕</span><div class="kick">NEW ARRIVAL</div><h3>Coral Wrap Dress</h3><div class="price">TT$420</div><p class="desc">Lightweight wrap dress with a tie waist and flutter sleeve. Fully lined. Model wears size S.</p><div class="lab">COLOUR · CORAL</div><div style="display:flex;gap:6px"><span class="sw sel" style="background:#b0605a;width:20px;height:20px"></span><span class="sw" style="background:#2a1a1f;width:20px;height:20px"></span><span class="sw" style="background:#f3e3d3;width:20px;height:20px"></span></div><div class="lab">SIZE</div><div class="szs"><span>XS</span><span class="on">S</span><span>M</span><span>L</span><span class="x">XL</span></div><div class="stock">● In stock at the boutique · 2 left in S</div><div class="btn p">Add to bag · TT$420</div><div class="btn s">Reserve for in-store pickup</div></div></div>`);}
if(s==='bag'){document.getElementById('bagn').textContent='2';document.body.insertAdjacentHTML('beforeend',`<div class="dim"></div><div class="drawer"><h3>Your bag</h3>
<div class="li"><span class="th" style="background:#f0dcd5">${D.dress('#b0605a')}</span><div>Coral Wrap Dress<small>Coral · Size S</small></div><b>TT$420</b></div>
<div class="li"><span class="th" style="background:#e2e6dc">${D.top('#7d9a78')}</span><div>Sage Tie Top<small>Sage · Size M</small></div><b>TT$260</b></div>
<div class="lab" style="margin-top:12px">HOW WOULD YOU LIKE IT?</div>
<div class="opt on"><i></i><div>Reserve and collect at the boutique<small>Held for 48 hours · try on before you pay</small></div></div>
<div class="opt"><i></i><div>Island-wide delivery<small>2 to 3 working days · fee confirmed before dispatch</small></div></div>
<div class="lab" style="margin-top:12px">PAYMENT</div>
<div class="opt on"><i></i><div>Pay in store</div></div>
<div class="opt"><i></i><div>Bank transfer or card online</div></div>
<div class="tot"><span>Total</span><span>TT$680</span></div>
<div class="btn p" style="margin-top:auto">Reserve my pieces</div><div class="btn wa">Or send to us on WhatsApp</div></div>`);}
</script></body></html>
